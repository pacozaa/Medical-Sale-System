services:
  db:
    image: postgres:16
    container_name: medical-sales-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_sales
    ports:
      - "5433:5432"
    volumes:
      - medical-sales-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_sales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medical-sales-data:
